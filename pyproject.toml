[tool.poetry]
name = "ConcertBot"
version = "0.1.0"
description = "A python HTTP interactive robot that complies with the OneBot protocol"
authors = ["shadlc <i@shadlc.net>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
pillow = "^11.2.1"
colorama = "^0.4.6"
bilibili-api-python = "^17.3.0"
idna = "^3.10"
certifi = "^2025.8.3"
httpx = "^0.28.1"
httpcore = "^1.0.9"
h11 = "^0.16.0"

[[tool.poetry.source]]
name = "ali"
priority = "primary"
url = "https://mirrors.aliyun.com/pypi/simple/"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pylint.basic]
module-rgx = "^([a-z_][a-z0-9_]*|[0-9]{3}[a-z][a-z0-9_]*)$"

[tool.pylint.format]
max-line-length = 200
